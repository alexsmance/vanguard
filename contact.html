<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Alex Mance</title>
  <link href="./assets/terra.css" rel="stylesheet" />
  <link href="./assets/website.css" rel="stylesheet" />  
  <style>
    @view-transition {
      navigation: auto;
    }

    * {
      color: #333333;
    }
    
    body {
      background-color: #333333;
      color: #333333;
      background: url(./assets/dancers.svg);
      background-size: cover;
      backdrop-filter: blur(8px);
    }

    label {
      margin: .5rem 0;
    }

    .depth {
      box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 1px 5px 0 rgba(0, 0, 0, 0.12), 0 3px 1px -2px rgba(0, 0, 0, 0.2);
    }

    button {
      width: 100%;
      margin: 0 1rem;
      display: flex;
      justify-content: center;
      border-radius: 1rem;
      color: #333333;
    }

    main {
      width: 100%;
      padding: 1rem;      
    }

    ul {
      list-style-type: none;
      margin-top: 1rem;
    }
    
    li {
      margin-bottom: 1rem;
    }

    li a,
    li a:visited {
      color: #333333;
    }

    li a img {
      color:#333333;
    }

    @media(min-width: 900px) {
      .contact-layout {
        min-height: 80vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: center;
        gap: 1rem; 
      }
      .contact-layout div:first-child {
        display: flex;
        align-items: center;
      }
    }    
  </style>
</head>
<body>
  <header>
    <h1 class="heading">Alex Mance</h1>
  </header>
  <main>
    <section>
      <h2 class="title">Contact</h2>
      <p class="subheading">If you would like to get in touch, please fill out the form below and I will get back to you as soon as possible.</p>
    </section>
    <div class="contact-layout">
      <section class="glass padding margin-vertical">
        <ul>
          <li>
            <p class="subheader">
              <a href="mailto:alex@example.com">
                <img src="./assets/mail.svg" 
                     alt="Email Icon"
                     style="width: 24px; height: 24px; margin-right: 0.5rem; padding-top: 0.25rem;"
                     class="icon"/>
                alex@asmance.com</a>            
            </p>
          </li>
          <li>
            <p class="subheader">
              <a href="https://github.com/alexsmance" 
                 target="_blank" 
                 rel="noopener noreferrer"
                 class="subheader">
                <img src="./assets/github.svg" 
                     alt="GitHub Icon" 
                     style="
                       width: 24px; 
                       height: 24px; 
                       margin-right: 0.5rem; 
                       padding-top: 0.25rem;"
                       class="icon"/>
                @alexsmance</a>
            </p>
          </li>
          <li>
            <p class="subheader">
              <a href="https://www.linkedin.com/in/alex-mance" 
                 target="_blank" 
                 rel="noopener noreferrer"
                 class="subheader">
                <img src="./assets/linkedin.svg" 
                     alt="LinkedIn Icon" 
                     style="width: 24px; height: 24px; margin-right: 0.5rem; padding-top: 0.25rem;"
                     class="icon"/>
                @alex-mance</a>
            </p>
          </li>
        </ul>
      </section>
  
      <section>
        <form class="paper padding margin-vertical">
          <fieldset class="margin-bottom">
            <label for="name" style="color: white;">Name:</label>
            <input type="text" id="name" class="depth padding-half" required/>
          </fieldset>
          <fieldset class="margin-bottom">
            <label for="email" style="color: white;">Email:</label>
            <input type="email" id="email" class="depth padding-half" required/>
          </fieldset>
          <button type="submit" class="primary padding margin-vertical subheading text-bold depth">Submit</button>
        </form>
      </section>
    </div>
  </main>
  <footer class="padding">
    <p class="uppercase">&copy; 2026 Alex Mance. All rights reserved.</p>
  </footer>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;

      fetch('https://api.asmance.com/api/contact', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: name,
          email: email
        })
      })      
      .then(response => {
        if (response.ok) {
          alert('Thank you for your submission!');
          document.querySelector('form').reset();
        } else {
          alert('There was a problem with your submission. Please try again.');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('There was a problem with your submission. Please try again.');
      });
    });
  </script>
</body>
</html>
