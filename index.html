<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Mance</title>
  <link href="./assets/terra.css" rel="stylesheet" />
</head>
<style>
  @view-transition {
    navigation: auto;
  }

  body {
    background-color: rgb(20, 20, 20);
  }

  header h1 {
    color: white;
  }

  #menu {
    display: flex;
    align-items: center;
  }

  #menu-items {
    margin: clamp(4rem, 20vw, 48rem);
    position: relative;
    z-index: 2;
  }

  #menu-items:hover > .menu-items {
    opacity: 0.1;
  }

  #menu-items > .menu-item:hover {
    opacity: 1;
  }

  .menu-item {
    color: white;
    display: block;
    text-decoration: none;
    padding: clamp(0.25rem, 0.5vw, 1rem) 0;
    transition: opacity 400ms ease;
  }

  #menu-background-pattern {
    background-image: radial-gradient(
      rgba(255, 255, 255, 0.1) 9%,
      transparent 9%
    );

    background-position: 0% 0%;
    background-size: 12vmin 12vmin;

    position: absolute;
    height: 100vh;
    left: 0px;
    top: 0px;
    z-index: 1;
    transition: opacity 800ms ease, 
                background-size 800ms ease,
                background-position 800ms ease;
    width: 100vw;
    z-index: 1;
  }

  #menu-items:hover ~ #menu-background-pattern {
    background-size: 11vmin 11vmin;
    opacity: 0.5;
  }

  #menu[data-active-index="0"] > #menu-background-pattern {
    background-position: 0% -25%;
  }

  #menu[data-active-index="1"] > #menu-background-pattern {
    background-position: 0% -50%;
  }

  #menu[data-active-index="2"] > #menu-background-pattern {
    background-position: 0% -75%;
  }

  #menu[data-active-index="3"] > #menu-background-pattern {
    background-position: 0% -100%;
  }

  #menu-background-image {
    background-image: url("./assets/venentian-love.svg");
    background-position: center 40%;
    background-size: 110vmax;
    height: 100%;
    left: 0px;  
    opacity: 0.15;
    position: absolute;
    top: 0px;
    transition: opacity 800ms ease,
      background-size 800ms ease,
      background-position 800ms ease;
    width: 100%;
    z-index: 0;
}

#menu-items:hover ~ #menu-background-pattern {
  background-size: 11vmin 11vmin;
  opacity: 0.5;
}

#menu-items:hover ~ #menu-background-image {
  background-size: 100vmax;
  opacity: 0.1;
}

#menu-items:hover > .menu-item {
  opacity: 0.3;
}

#menu-items:hover > .menu-item:hover {
  opacity: 1; 
}
</style>
<body>
  <header>
    <h1 class="heading">Alex Mance</h1>
  </header>
  <div id="menu">
    <div id="menu-items">
      <a href="index.html" class="menu-item title">Home</a>
      <a href="services.html" class="menu-item title">Services</a>
      <a href="about.html" class="menu-item title">About</a>
      <a href="contact.html" class="menu-item title">Contact</a>      
    </div>
    <div id="menu-background-pattern"></div>
    <div id="menu-background-image"></div>
  </div>
  <script>
    const menu = document.getElementById("menu");

    Array.from(document.getElementsByClassName("menu-item"))
      .forEach((item, index) => {
      item.onmouseover = () => {
        menu.dataset.activeIndex = index;
      }
    });
  </script>
</body>
</html>
